name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web-changed: ${{ steps.filter.outputs.web }}
      api-changed: ${{ steps.filter.outputs.api }}
      packages-changed: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'turbo.json'
              - 'docker-compose.yml'
              - 'apps/web/Dockerfile'
            api:
              - 'apps/api/**'
              - 'package.json'
              - 'turbo.json'
              - 'docker-compose.yml'
              - 'apps/api/Dockerfile'
            packages:
              - 'packages/**'

  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.web-changed == 'true' || needs.detect-changes.outputs.api-changed == 'true' || needs.detect-changes.outputs.packages-changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build with docker-compose
        run: docker-compose build

      - name: Test containers
        run: |
          docker-compose up -d
          sleep 10

          # Test API health
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api)
          if [ "$API_STATUS" != "200" ]; then
            echo "API is not healthy, status: $API_STATUS"
            docker-compose logs api
            exit 1
          fi

          # Test web health
          WEB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3400)
          if [ "$WEB_STATUS" != "200" ]; then
            echo "Web is not healthy, status: $WEB_STATUS"
            docker-compose logs web
            exit 1
          fi

          docker-compose down
